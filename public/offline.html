<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#41513f" />
    <title>Bob behöver internet</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; background: #faf8f1; color: #272620; font: 17px/1.6 system-ui, sans-serif; }
      main { max-width: 480px; margin: 12vh auto 40px; }
      svg { width: 72px; height: 72px; }
      h1 { font-size: 28px; line-height: 1.2; }
      a { display: block; margin-top: 24px; padding: 14px 20px; background: #41513f; color: #f3f1e8; border-radius: 11px; text-align: center; text-decoration: none; font-weight: 700; }
      a:focus-visible { outline: 3px solid #41513f; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#41513F"/><polygon points="50,28 37,51 63,51" fill="#7E9B52"/><polygon points="50,40 34,66 66,66" fill="#7E9B52"/><rect x="46" y="64" width="8" height="9" rx="1.5" fill="#7E9B52"/></svg>
      <h1>Bob behöver internet</h1>
      <p>Anslutningen verkar saknas. Slå på mobildata eller anslut till wifi och försök igen.</p>
      <p>Du behöver vara uppkopplad för att läsa och ändra projekt, visa bilder och fråga Bob.</p>
      <a href="./">Försök igen</a>
    </main>
  </body>
</html>
