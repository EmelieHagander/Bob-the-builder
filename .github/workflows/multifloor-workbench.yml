name: Publish verified multi-floor study
on:
  push:
    branches: [feat/bob-multifloor-geometry]
    paths: [.github/workflows/multifloor-workbench.yml]
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'EmelieHagander/Bob-the-builder' && github.ref == 'refs/heads/feat/bob-multifloor-geometry'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 12
      - name: Verify unchanged baseline and exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet fe8ef795c9799dbf64d9a7d1e68751df2b19459e -- Docs src scripts supabase tests
          python3 - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          parts = sorted(Path('.github/multifloor-patch').glob('*.b64'))
          assert [p.name for p in parts] == [f'{i:02d}.b64' for i in range(4)]
          patch = lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '1fc50f1e4647d1ca98f70125a9cfae79217852ae4847ffb24184cca13dec01f5'
          Path(os.environ['RUNNER_TEMP'], 'multifloor.patch').write_bytes(patch)
          PY
          git apply --check --index --exclude=.github/workflows/multifloor-workbench.yml "$RUNNER_TEMP/multifloor.patch"
          git apply --index --whitespace=error-all --exclude=.github/workflows/multifloor-workbench.yml "$RUNNER_TEMP/multifloor.patch"
          git rm .github/workflows/multifloor-workbench.yml .github/multifloor-patch/*.b64
          git diff --cached --check
          test "$(git write-tree)" = '44d314443afc54ccc4a539a827da13026ac63786'
      - name: Commit exact tested source on feature branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add shared multi-floor coordinate studies and read-only projection'
          git push origin HEAD:refs/heads/feat/bob-multifloor-geometry
