name: P1 source snapshot
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.head_ref == 'fix/p1-cad-source-lineage-20260929'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Archive source and isolated SQL test runtime
        run: |
          git rev-parse HEAD > source-commit.txt
          git archive --format=tar HEAD > source.tar
          tar -cf test-deps.tar node_modules/@electric-sql/pglite
          sha256sum source.tar test-deps.tar > source-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p1-review-source
          path: |
            source.tar
            test-deps.tar
            source-commit.txt
            source-sha256.txt
          retention-days: 2
