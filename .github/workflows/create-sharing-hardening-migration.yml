name: Create sharing hardening migration

on:
  push:
    branches:
      - fix/sharing-rollout-hardening
    paths:
      - .github/workflows/create-sharing-hardening-migration.yml

permissions:
  contents: write

jobs:
  create-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sharing-rollout-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create migration through Supabase CLI
        run: npx supabase migration new sharing_rollout_hardening
      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git commit -m "Add sharing rollout hardening migration scaffold"
          git push origin HEAD:fix/sharing-rollout-hardening
