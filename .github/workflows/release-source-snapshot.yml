name: Bob release source snapshot
on:
  push:
    branches: [release/bob-tools-and-knowledge-plan]
    paths: [.github/workflows/release-source-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar HEAD | gzip > release-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: bob-release-source
          path: release-source.tar.gz
          retention-days: 1
