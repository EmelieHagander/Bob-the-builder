name: Patch 4B1 and 4B2a release docs

on:
  push:
    branches: [docs/record-material-planning-release]
    paths:
      - .github/workflows/patch-material-release-docs.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/record-material-planning-release
      - name: Update canonical release truth
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one marker, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # Material-planning domain contract owns behavior/status, not release ordering.
          replace_once(
              'Docs/material-planning.md',
              '**Status:** manual Slice 4B2a implementation in progress; not deployed. This contract owns the persisted material-requirement, stock-allocation and Shopping handoff foundation. `Docs/v1-plan.md` owns release order and the later supported geometry calculators / executable-work-plan gates.',
              '**Status:** manual Slice 4B2a implemented, merged, migrated, deployed and live-verified on 2026-09-14. This contract owns the persisted material-requirement, stock-allocation and Shopping handoff foundation. [PR 39](https://github.com/EmelieHagander/Bob-the-builder/pull/39) delivered the foundation and [PR 50](https://github.com/EmelieHagander/Bob-the-builder/pull/50) aligned the release proof with persisted server truth. `Docs/v1-plan.md` owns release order and the later supported geometry calculators / executable-work-plan gates; `Docs/foundation-verification.md` owns release evidence.'
          )
          replace_once(
              'Docs/material-planning.md',
              '4B2a creates manual versions only. The deterministic value exists in the model so later supported calculators can add new requirement revisions rather than replacing the foundation.',
              '4B2a creates manual versions only. Persisted manual versions use `method_key = manual` and `method_version = 4B2a-v1`; browser and hosted release proofs are regression-locked to that server identity. The deterministic value exists in the model so later supported calculators can add new requirement revisions rather than replacing the foundation.'
          )

          # V1 execution marker.
          replace_once('Docs/v1-plan.md', '## Current execution position — 2026-09-13', '## Current execution position — 2026-09-14')
          replace_once(
              'Docs/v1-plan.md',
              '- Slice 4A — manual plans/drawings with exact target and measurement lineage.',
              '- Slice 4A — manual plans/drawings with exact target and measurement lineage;\n- Slice 4B1 — deterministic `stud_wall_opening_v1` artifact geometry with exact Building/Space and six-measurement recipe lineage;\n- Slice 4B2a — manual material requirements, revisioned stock/reuse allocation, transparent purchase arithmetic and explicit Shopping handoff.'
          )
          marker = 'Slice 2C is now runtime truth, not merely committed design: PR #42 delivered the domain/schema/authority foundation, PR #43 the app-facing UI, and PR #45 the hosted cleanup-order correction. The dedicated browser proof passes at 320px, 390px and 1280px; the hosted Auth/PostgREST live check passes and self-cleans its physical fixture; the current `main` Pages deployment is green. `Docs/foundation-verification.md` owns exact migration/run evidence.'
          replace_once(
              'Docs/v1-plan.md',
              marker,
              marker + '\n\n4B1 and 4B2a are also runtime truth. PR #47 delivered the narrow deterministic stud-wall-with-opening generator, PR #49 closed its hosted/live release gate, PR #39 delivered the manual material receiver and PR #50 corrected verification-only method-key drift without changing runtime behavior. The final 4B2a Pages deployment and ordinary hosted Auth/PostgREST foundation check are green; `Docs/foundation-verification.md` owns the exact migration, advisor, browser, live and cleanup evidence.'
          )
          replace_once(
              'Docs/v1-plan.md',
              '- deterministic generated geometry, BOM/calculations, stock/shopping propagation and richer executable work planning after 4A;',
              '- Slice 4B2b — deterministic geometry-derived material base quantities for supported fixtures, including later fastener/consumable rules where explicitly modelled;\n- richer task/material/dependency/tool/readiness relations that turn the persisted plan into executable work;'
          )
          old_next = '**Current next implementation milestone:** **Slice 4B1 deterministic artifact geometry for the deliberately narrow supported fixture.** PR #47 is the active implementation branch for the first timber stud-wall-with-opening fixture. Treat that PR as implementation in progress, not as built/deployed truth until its own schema, browser and live gates pass. Generated geometry must consume explicit `Building` / `Space` context and pinned measurements rather than treating project `Area` as the house model.'
          new_next = '**Current next implementation milestone:** **Slice 4B2b deterministic material quantities for the supported 4B1 geometry fixture.** New quantity revisions must feed the existing 4B2a `material_requirements` foundation with `source_kind = deterministic`, pinned recipe/input lineage and transparent arithmetic rather than creating a parallel BOM system. Start with quantities that are reproducible from the saved stud-wall recipe; generic fasteners, consumables, catalogue pricing and engineering assumptions remain out until explicitly specified.'
          replace_once('Docs/v1-plan.md', old_next, new_next)
          old_order = '1. complete and release-gate the narrow deterministic artifact-geometry fixture (4B1), preserving physical-target and measurement provenance;\n2. add transparent quantity/BOM derivation, existing-stock deduction and Shopping propagation, then richer task/dependency/tool/readiness relations;\n3. add the deferred AI consumers on top of the persisted foundations rather than making AI output the only place those concepts exist;\n4. complete Slice 5 guidance and progress/as-built loops against the same persisted project + physical context.'
          new_order = '1. add 4B2b deterministic quantity derivation from the supported 4B1 recipe into new 4B2a material-requirement revisions, preserving exact recipe/input provenance;\n2. add richer task/material/dependency/tool/readiness relations on top of the persisted target, drawings and material plan;\n3. add the deferred AI consumers on top of the persisted foundations rather than making AI output the only place those concepts exist;\n4. complete Slice 5 guidance and progress/as-built loops against the same persisted project + physical context.'
          replace_once('Docs/v1-plan.md', old_order, new_order)

          # Capability inventory: update superseded GAP language and add explicit delta.
          replace_once(
              'Docs/function-inventory.md',
              'baseline before Slice 0 and milestones 1A/1B, 2A/2B, 2C, 3A and 4A**.',
              'baseline before Slice 0 and milestones 1A/1B, 2A/2B, 2C, 3A, 4A, 4B1 and 4B2a**.'
          )
          replace_once(
              'Docs/function-inventory.md',
              '| Full evidence/planning loop | **PARTIAL.** Media/manual steps, measurements/parts, manual solution/target revisions and manual plans/drawings are delivered in the deltas here. Generated proposals, deterministic geometry/calculations and structured progress/as-built history retain their later gates. |',
              '| Full evidence/planning loop | **PARTIAL.** Media/manual steps, measurements/parts, manual solution/target revisions, manual plans/drawings, one deterministic drawing fixture and the manual material/stock/Shopping receiver are delivered in the deltas here. Generated proposals, geometry-derived material quantities, executable-work planning and structured progress/as-built history retain later gates. |'
          )
          replace_once(
              'Docs/function-inventory.md',
              '| Stock and calculation integration | **GAP.** Parts are separate from shopping, but stock deduction, deterministic calculations and downstream artifact/task generation remain later gates. |',
              '| Stock and calculation integration | **PARTIAL.** 4B2a now stores revisioned material stock and deliberate reusable-component allocations, derives allowance/shortfall/purchase rounding server-side and explicitly propagates the saved purchase need to Shopping. Geometry-derived base quantities remain 4B2b; downstream task readiness remains later. |'
          )
          replace_once(
              'Docs/function-inventory.md',
              '| Whole-plan ingestion, deterministic geometry and AI reasoning | **GAP / later slices.** The shipped model is the foundation those consumers must extend. It does not itself claim CAD/BIM, photo-to-plan import, generated geometry, engineering approval or AI-confirmed fact promotion. |',
              '| Whole-plan ingestion, deterministic geometry and AI reasoning | **PARTIAL / later slices.** 4B1 now consumes the shipped physical model for one deterministic stud-wall-with-opening fixture with exact Space/measurement lineage. General CAD/BIM, photo-to-plan import, broader geometry, engineering approval and AI-confirmed fact promotion remain later. |'
          )
          replace_once(
              'Docs/function-inventory.md',
              '| Generated visual proposals and downstream planning | **PARTIAL.** Manual plans/drawings are now delivered by 4A. Generated proposal/mockup imagery, deterministic drawing geometry, calculations and propagation into tasks/shopping remain later. Selection expresses intent, not engineering approval. |',
              '| Generated visual proposals and downstream planning | **PARTIAL.** 4A manual drawings, 4B1 deterministic stud-wall geometry and 4B2a manual material/stock/Shopping propagation are delivered. Generated proposal/mockup imagery, geometry-derived material quantities and executable task planning remain later. Selection expresses intent, not engineering approval. |'
          )
          replace_once(
              'Docs/function-inventory.md',
              '| Generated geometry, BOM and downstream work | **GAP.** 4A is a manual truth foundation. Deterministic drawing generation, quantity derivations/BOM, stock deduction, Shopping propagation, task-material links, dependencies/tools/readiness and Bob/vision consumption remain later gates. |',
              '| Generated geometry, BOM and downstream work | **PARTIAL.** 4B1 adds one deterministic stud-wall-with-opening drawing recipe and 4B2a adds the manual material receiver, stock/reuse deduction and explicit Shopping propagation. Geometry-derived base quantities/BOM rules (4B2b), fasteners/consumables, task-material links, dependencies/tools/readiness and Bob/vision consumption remain later gates. |'
          )
          inventory_anchor = 'The [V1 delivery order](v1-plan.md#delivery-order--foundations-first-owner-decision-2026-09-09)'
          inventory_delta = '''## Deterministic geometry and material-planning release delta — 2026-09-14

**Status:** 4B1 and manual 4B2a are implemented, merged, migrated, deployed and live-verified. [Plans and drawings](artifacts.md) owns the deterministic geometry contract; [material planning](material-planning.md) owns requirements/stock/Shopping behavior; [foundation verification](foundation-verification.md) owns exact release evidence.

| Foundation | Current status |
|---|---|
| Deterministic stud-wall geometry (4B1) | **BUILT narrowly.** `stud_wall_opening_v1` recomputes responsive SVG/vector geometry from one accepted project-scoped Space revision, six exact measurement revisions and explicit stud spacing. Regeneration creates a new Artifact revision; older recipes remain reproducible. It is not general CAD/BIM or structural header/load-path sizing. |
| Versioned generation recipe | **BUILT.** `artifact_generations` and `artifact_geometry_inputs` pin generator/version, Building, Space revision, role-mapped measurements and explicit design parameters under project RLS. Unknown inputs cannot generate; estimated inputs remain concept-only. |
| Manual material requirements (4B2a) | **BUILT.** A human enters base quantity/basis; the server versions exact target and optional drawing lineage and deterministically derives allowance, confirmed available quantity and rounded purchase need. Persisted manual method identity is `manual` / `4B2a-v1`. |
| Stock and reuse reservation | **BUILT.** Revisioned material stock is separate from Shopping. Exact stock/component revisions are allocated with serialized capacity checks so concurrent current requirements cannot over-reserve known availability. Later source changes make requirements stale without rewriting history. |
| Shopping handoff | **BUILT.** Send/Update Shopping is explicit, publishes the saved purchase need and preserves existing supplier, cost and status. Requirement changes, source staleness and independent Shopping edits remain visibly distinct; requirement saves never silently mutate Shopping. |
| Geometry-derived BOM quantities (4B2b) | **GAP / next.** The receiver already reserves `source_kind = deterministic`, but no supported calculator yet turns the 4B1 recipe into material base quantities. That work must create normal material-requirement revisions rather than a second BOM store. |
| Executable work planning | **GAP / later.** Task-material links, dependency graph, tool lists and readiness reasons remain after the quantity layer. |

'''
          replace_once('Docs/function-inventory.md', inventory_anchor, inventory_delta + inventory_anchor)
          replace_once(
              'Docs/function-inventory.md',
              '## Historical audit — before Slice 0 and milestones 1A/1B, 2A/2B, 2C, 3A and 4A',
              '## Historical audit — before Slice 0 and milestones 1A/1B, 2A/2B, 2C, 3A, 4A, 4B1 and 4B2a'
          )

          # Foundation verification journal: newest releases first.
          verification_anchor = '## Delivered persistent building context (2C)'
          verification_insert = '''## Delivered manual material planning (4B2a)

**Status:** manual 4B2a implemented, merged, migrated, deployed and live-verified on 2026-09-14. [PR 39](https://github.com/EmelieHagander/Bob-the-builder/pull/39) merged as `1093fafbdbc5fc4ef0e477f0f6741c03bc3860b7`; verification-only [PR 50](https://github.com/EmelieHagander/Bob-the-builder/pull/50) merged as `fd737d45f1804245c31420037f8f12471302a7c5`. [Material planning](material-planning.md) owns behavior and limits.

### Automated, browser and hosted migration evidence

- Pre-merge [CI 34810364646](https://github.com/EmelieHagander/Bob-the-builder/actions/runs/34810364646) passes the full schema/domain, TypeScript/Vite, edge, PWA/install, Ask bob, foundation browser and Building-context suite. The Material plan proof runs inside the existing foundation harness at 320/390/1280px and covers stock/reuse, transparent arithmetic, explicit Shopping handoff, persisted delivered status, Update Shopping, reload and project isolation.
- Follow-up #50 [CI 34811122576](https://github.com/EmelieHagander/Bob-the-builder/actions/runs/34811122576) is fully green and regression-locks browser/live `method_key = manual` to the server SQL; it changes no schema, arithmetic, Shopping or UI behavior.
- Five additive source migrations were applied in order:

| Source migration | Hosted registry |
|---|---|
| `20260913210000_material_planning.sql` | `20260914053521_bob_material_planning_4b2a` |
| `20260913210100_material_planning_hardening.sql` | `20260914053538_bob_material_planning_4b2a_hardening` |
| `20260913210200_material_planning_publish.sql` | `20260914053605_bob_material_planning_4b2a_publish` |
| `20260913210300_material_planning_reservation_serialization.sql` | `20260914053620_bob_material_planning_4b2a_reservation_serialization` |
| `20260913210400_material_planning_fk_index.sql` | `20260914054215_bob_material_planning_4b2a_fk_index` |

Post-DDL security review reports no new 4B2a-specific security finding. Performance review found one new composite-parent FK covering-index opportunity; the fifth migration adds `material_requirement_revisions_parent_idx(requirement_id, project_id)` and the finding disappears on re-check. Expected fresh-unused-index notices and unrelated shared-database findings remain informational. See the [unindexed-FK remediation guide](https://supabase.com/docs/guides/database/database-linter?lint=0001_unindexed_foreign_keys).

### Live Auth/PostgREST proof, deploy and cleanup

The first post-merge live run [34810721689](https://github.com/EmelieHagander/Bob-the-builder/actions/runs/34810721689) reached the hosted material path and exposed verification drift only: runtime persisted `method_key = manual` while the proof expected `manual_base`. PR #50 aligned the fixtures with the already-deployed server truth and added a regression guard; no production schema/data behavior changed.

Final [Pages 34811372007](https://github.com/EmelieHagander/Bob-the-builder/actions/runs/34811372007) and [live foundation check 34811372088](https://github.com/EmelieHagander/Bob-the-builder/actions/runs/34811372088) pass on `main` commit `fd737d45f1804245c31420037f8f12471302a7c5`. Through the ordinary authenticated Bob client, the live material proof verifies exact target/drawing/stock/reuse lineage, `4 pcs → 1 stock → 2 reusable → 1 to buy`, a revised `2 to buy`, explicit Shopping publish/update with delivered status/supplier/cost preserved, independent Shopping-edit disclosure, stale-source publish rejection, raw-write denial and project isolation. No AI is invoked.

The shared foundation run also passes facts, solutions, deterministic geometry, drawings and Building context, removes image bytes/metadata/attachments through normal APIs and removes the temporary physical fixture through guarded physical-authority commands. Operator cleanup then deleted the two exact disposable verification projects from the initial proof-drift run and the final green run after checking exact nonce names/descriptions and zero media. A final query reports zero projects, material requirements, stock items, artifacts and media for those two fixture ids.

## Delivered deterministic artifact geometry (4B1)

**Status:** narrow 4B1 implemented, merged, migrated, deployed and live-verified on 2026-09-13. [PR 47](https://github.com/EmelieHagander/Bob-the-builder/pull/47) delivered the generator and persistence; [PR 49](https://github.com/EmelieHagander/Bob-the-builder/pull/49) closed the hosted release proof. [Plans and drawings](artifacts.md) owns geometry behavior and limits.

The release stores deterministic `stud_wall_opening_v1` recipes in `artifact_generations` plus six exact role-mapped `artifact_geometry_inputs`. It pins Building, accepted Space revision, exact Measurement revisions and explicit stud spacing; unknown dimensions fail, estimated inputs remain concept-only, and regeneration creates a new Artifact revision rather than rewriting history. SVG/vector output is recomputed from the versioned recipe; raster output is not truth. It does not claim general CAD/BIM, structural header/load-path sizing or material quantities.

Source migrations map to hosted history as follows:

| Source migration | Hosted registry |
|---|---|
| `20260913193000_artifact_deterministic_geometry.sql` | `20260913212211_bob_artifact_deterministic_geometry` |
| `20260913193100_artifact_geometry_command_grant.sql` | `20260913212218_bob_artifact_geometry_command_grant` |
| `20260913193200_artifact_geometry_invariants.sql` | `20260913212229_bob_artifact_geometry_invariants` |
| `20260913194000_artifact_generation_space_revision_index.sql` | `20260913213315_bob_artifact_generation_space_revision_index` |

The implementation branch's full CI/browser gate [34775629980](https://github.com/EmelieHagander/Bob-the-builder/actions/runs/34775629980) is green. Final [Pages 34784328229](https://github.com/EmelieHagander/Bob-the-builder/actions/runs/34784328229) and [live foundation check 34784328249](https://github.com/EmelieHagander/Bob-the-builder/actions/runs/34784328249) pass on the 4B1 live-proof `main`. The ordinary Auth/PostgREST run verifies persistent Space target, six exact measurements, recipe read-back, raw-write/RLS denial, unknown/out-of-bounds rejection, regeneration history and archive/restore carry-forward, then detaches its stable physical verification fixture. No AI is invoked.

'''
          replace_once('Docs/foundation-verification.md', verification_anchor, verification_insert + verification_anchor)

          # Database map: add new types and release sections while preserving old 4A truth in its own scope.
          replace_once(
              'db/README.md',
              '| `ProjectArtifact`, `ArtifactVersion` | `bob.artifacts`, append-only `bob.artifact_revisions`, exact `bob.artifact_measurements`, invoker `bob.current_artifacts` / `bob.artifact_measurement_details` |',
              '| `ProjectArtifact`, `ArtifactVersion` | `bob.artifacts`, append-only `bob.artifact_revisions`, exact `bob.artifact_measurements`, invoker `bob.current_artifacts` / `bob.artifact_measurement_details` |\n| deterministic Artifact generation recipe | `bob.artifact_generations`, `bob.artifact_geometry_inputs`, invoker Artifact views + guarded `bob.artifact_geometry_command` |'
          )
          replace_once(
              'db/README.md',
              '| `Material` | `bob.materials` (`area` → `area_label`) |',
              '| `Material` | `bob.materials` (`area` → `area_label`) |\n| material stock / requirement revisions | `bob.stock_items`, `bob.stock_revisions`, `bob.material_requirements`, `bob.material_requirement_revisions` + allocation/shopping-link tables and invoker views |'
          )
          replace_once(
              'db/README.md',
              'claim deterministic geometry, BOM/calculation, stock/shopping or task readiness.',
              'claim deterministic geometry, BOM/calculation, stock/shopping or task readiness. Those capabilities extend this foundation in the later sections below.'
          )
          db_anchor = '## Persistent building context foundation (2C)'
          db_insert = '''## Deterministic artifact geometry foundation (4B1)

[`Docs/artifacts.md`](../Docs/artifacts.md) also owns the narrow deterministic geometry extension. Source migrations `20260913193000_artifact_deterministic_geometry.sql`, `20260913193100_artifact_geometry_command_grant.sql`, `20260913193200_artifact_geometry_invariants.sql` and `20260913194000_artifact_generation_space_revision_index.sql` are hosted as `20260913212211_bob_artifact_deterministic_geometry`, `20260913212218_bob_artifact_geometry_command_grant`, `20260913212229_bob_artifact_geometry_invariants` and `20260913213315_bob_artifact_generation_space_revision_index`.

`artifact_generations` owns the versioned generator/physical target/design parameters and `artifact_geometry_inputs` owns the six exact measurement roles. Normal clients read under project RLS and generate/regenerate through guarded `bob.artifact_geometry_command`; ordinary Artifact archive/restore carries complete recipes forward. This foundation is deterministic geometry only, not a material BOM or engineering approval.

## Manual material planning foundation (4B2a)

[`Docs/material-planning.md`](../Docs/material-planning.md) owns revisioned manual requirements, material stock/reuse allocations, deterministic allowance/shortfall/purchase rounding and explicit Shopping handoff. Source migrations and hosted registry entries are:

| Source migration | Hosted registry |
|---|---|
| `supabase/migrations/20260913210000_material_planning.sql` | `20260914053521_bob_material_planning_4b2a` |
| `supabase/migrations/20260913210100_material_planning_hardening.sql` | `20260914053538_bob_material_planning_4b2a_hardening` |
| `supabase/migrations/20260913210200_material_planning_publish.sql` | `20260914053605_bob_material_planning_4b2a_publish` |
| `supabase/migrations/20260913210300_material_planning_reservation_serialization.sql` | `20260914053620_bob_material_planning_4b2a_reservation_serialization` |
| `supabase/migrations/20260913210400_material_planning_fk_index.sql` | `20260914054215_bob_material_planning_4b2a_fk_index` |

Normal clients select RLS-protected tables/security-invoker views and write only through `bob.stock_command` and `bob.material_requirement_command`; private helpers remain in `bob_private`. Manual requirement versions persist `source_kind = manual`, `method_key = manual`, `method_version = 4B2a-v1`. Reservation triggers lock stock/component identities while rechecking capacity so concurrent requirements cannot overbook current confirmed availability. Shopping publish is explicit and preserves existing supplier/cost/status on update. `src/data/materialPlanning.ts` is the domain adapter behind the single `database.ts` UI seam.

[Foundation verification](../Docs/foundation-verification.md) owns CI/browser, hosted migration/advisor, Pages, ordinary Auth/PostgREST and cleanup evidence. 4B2a intentionally does not derive base quantities from geometry; the next 4B2b calculator must create normal deterministic-source requirement revisions in this same model.

'''
          replace_once('db/README.md', db_anchor, db_insert + db_anchor)

          # Ensure we did not accidentally leave the old implementation-status phrase.
          for path in ['Docs/material-planning.md','Docs/v1-plan.md','Docs/function-inventory.md','Docs/foundation-verification.md','db/README.md']:
              if '\r' in Path(path).read_text():
                  raise SystemExit(f'{path}: unexpected CR characters')
          PY
          rm .github/workflows/patch-material-release-docs.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Docs/material-planning.md Docs/v1-plan.md Docs/function-inventory.md Docs/foundation-verification.md db/README.md .github/workflows/patch-material-release-docs.yml
          git commit -m "Record live 4B1 and 4B2a release truth"
          git push origin HEAD:docs/record-material-planning-release
