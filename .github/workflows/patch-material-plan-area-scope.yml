name: Patch material plan area scope

on:
  push:
    branches:
      - feat/material-plan-area-scope

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/material-plan-area-scope
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/MaterialPlan.tsx')
          s = p.read_text()
          old = "  const [area, setArea] = useState(value?.areaId ?? '')"
          if s.count(old) != 3:
              raise SystemExit(f'Expected three Area state declarations, found {s.count(old)}')
          p.write_text(s.replace(old, "  const [stockArea, setStockArea] = useState(value?.areaId ?? '')", 1))
          PY
          python scripts/apply-material-plan-area-scope-patch.py
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/MaterialPlan.tsx')
          s = p.read_text()
          s = s.replace("  const [stockArea, setStockArea] = useState(value?.areaId ?? '')", "  const [area, setArea] = useState(value?.areaId ?? '')", 1)
          p.write_text(s)

          p = Path('scripts/material-planning-browser.mjs')
          s = p.read_text()
          old = "  await page.locator('a.back-link').filter({ hasText: /^Shopping$/ }).click()"
          if s.count(old) != 2:
              raise SystemExit(f'Expected two Shopping back-link checks, found {s.count(old)}')
          p.write_text(s.replace(old, "  await page.goto(base + '#/shopping')", 2))

          p = Path('tests/material-planning-restack.test.ts')
          s = p.read_text()
          old = '''test('material browser proof scopes Shopping navigation to the page back link', async () => {
  const script = await readFile(new URL('../scripts/material-planning-browser.mjs', import.meta.url), 'utf8')
  assert.match(script, /locator\\('a\\.back-link'\\).*\\^Shopping\\$/, 'desktop proof should target the local Shopping back link')
  assert.doesNotMatch(script, /getByRole\\('link', \\{ name: 'Shopping', exact: true \\}\\)/, 'desktop sidebar and page back link share the same accessible name')
})'''
          new = '''test('material plan preserves Area context while Project scope retains Shopping navigation', async () => {
  const [pageSource, script] = await Promise.all([
    readFile(new URL('../src/pages/MaterialPlan.tsx', import.meta.url), 'utf8'),
    readFile(new URL('../scripts/material-planning-browser.mjs', import.meta.url), 'utf8'),
  ])
  assert.ok(pageSource.includes('activeArea ? <Link to={`/areas/${activeArea.slug}`} className="back-link">'),
    'Area-scoped material planning should return to its workstream')
  assert.ok(pageSource.includes('<Link to="/shopping" className="back-link">Shopping</Link>'),
    'Project-scoped material planning should retain the Shopping back link')
  assert.match(script, /page\\.goto\\(base \\+ '#\\/shopping'\\)/,
    'browser proof should navigate explicitly when it leaves Area scope for Shopping')
})'''
          if s.count(old) != 1:
              raise SystemExit('Expected material navigation regression block once')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: npm ci
      - run: npm test
      - run: npm run check:edge
      - run: npm run build
      - run: node --check scripts/solutions-browser.mjs
      - run: node --check scripts/artifacts-browser.mjs
      - run: node --check scripts/material-planning-browser.mjs
      - name: Build with dummy live configuration
        env:
          VITE_SUPABASE_URL: https://pwa-proof.invalid
          VITE_SUPABASE_ANON_KEY: installation-test-only
        run: npm run build
      - name: Browser foundation regression
        run: CHROME_PATH="$(command -v google-chrome)" npm run verify:foundations
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-material-plan-area-scope.yml scripts/apply-material-plan-area-scope-patch.py
          git add src/pages/MaterialPlan.tsx scripts/solutions-browser.mjs scripts/artifacts-browser.mjs scripts/material-planning-browser.mjs tests/material-planning-restack.test.ts
          git commit -m "Scope material planning to Project or Area targets"
          git push origin HEAD:feat/material-plan-area-scope
