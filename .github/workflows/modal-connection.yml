name: Modal connection
on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment containing the Modal credentials
        default: github-pages
        required: true
        type: environment
  push:
    branches: [main]
    paths: ['.github/workflows/modal-connection.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: ${{ inputs.environment || 'github-pages' }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install modal==1.5.5
      - name: Verify Modal credentials without displaying them
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        shell: python
        run: |
          import os, subprocess, sys
          names = ("MODAL_TOKEN_ID", "MODAL_TOKEN_SECRET")
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing environment secrets: " + ", ".join(missing))
          for name, prefix in zip(names, ("ak-", "as-")):
              value = os.environ[name]
              print(name + ": present; expected prefix=" + str(value.startswith(prefix)) + "; surrounding whitespace=" + str(value != value.strip()), flush=True)
          probe = """
          import asyncio
          from modal.client import _Client
          from modal_proto import api_pb2
          async def main():
              stage = "connect"
              try:
                  client = await _Client.from_env()
                  await client.hello()
                  print("PROBE:authenticated", flush=True)
                  stage = "token-info"
                  await client.stub.TokenInfoGet(api_pb2.TokenInfoGetRequest())
                  print("PROBE:passed", flush=True)
              except Exception as exc:
                  allowed = {"AuthError", "ConnectionError", "TimeoutError", "GRPCError", "InvalidError", "PermissionError", "SSLError", "gaierror", "ImportError", "ModuleNotFoundError", "AttributeError"}
                  kind = type(exc).__name__
                  print("PROBE:" + stage + ":" + (kind if kind in allowed else "other-error"), flush=True)
                  status = getattr(getattr(exc, "status", None), "name", "")
                  if status in {"UNAUTHENTICATED", "PERMISSION_DENIED", "UNAVAILABLE", "DEADLINE_EXCEEDED", "INTERNAL", "INVALID_ARGUMENT", "UNIMPLEMENTED"}:
                      print("PROBE:status:" + status, flush=True)
                  raise SystemExit(1)
          asyncio.run(main())
          """
          try:
              result = subprocess.run([sys.executable, "-c", probe], capture_output=True, text=True, timeout=90)
          except subprocess.TimeoutExpired:
              raise SystemExit("Modal connection timed out after 90 seconds.")
          allowed = {"PROBE:authenticated", "PROBE:passed"}
          for stage in ("connect", "token-info"):
              for kind in ("AuthError", "ConnectionError", "TimeoutError", "GRPCError", "InvalidError", "PermissionError", "SSLError", "gaierror", "ImportError", "ModuleNotFoundError", "AttributeError", "other-error"):
                  allowed.add("PROBE:" + stage + ":" + kind)
          for status in ("UNAUTHENTICATED", "PERMISSION_DENIED", "UNAVAILABLE", "DEADLINE_EXCEEDED", "INTERNAL", "INVALID_ARGUMENT", "UNIMPLEMENTED"):
              allowed.add("PROBE:status:" + status)
          lines = [line for line in result.stdout.splitlines() if line in allowed]
          for line in lines:
              print(line)
          if result.returncode:
              raise SystemExit("Modal diagnostic failed; only safe diagnostic codes are shown.")
          if "PROBE:passed" not in lines:
              raise SystemExit("Modal probe returned no recognized result.")
          print("Modal authentication passed.")
