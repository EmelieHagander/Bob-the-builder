name: Dependency refresh

on:
  push:
    branches:
      - security/dependency-audit-2026-09-15
    paths:
      - .github/workflows/dependency-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/dependency-audit-2026-09-15
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply targeted dependency updates
        run: |
          npm install --save-exact react-router-dom@7.18.0
          npm install --save-dev --save-exact vite@6.4.3 supabase@2.117.0
      - name: Verify runtime audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Verify full audit has no high or critical findings
        run: npm audit --audit-level=high
      - run: npm test
      - run: npm run check:edge
      - run: npm run build
      - name: Commit lockfile refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --check
          git commit -m "security(deps): update vulnerable dependencies"
          git push origin HEAD:security/dependency-audit-2026-09-15
