name: Dependency refresh

on:
  push:
    branches:
      - security/dependency-audit-2026-09-15
    paths:
      - .github/workflows/dependency-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/dependency-audit-2026-09-15
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply targeted dependency updates
        run: |
          npm install --save-exact react-router-dom@7.18.4
          npm install --save-dev --save-exact vite@6.4.3 supabase@2.117.0
          npm audit fix
          npm pkg set 'scripts.check:edge=deno check --node-modules-dir=manual supabase/functions/ask-bob/index.ts supabase/functions/ask-launchpad/index.ts supabase/functions/volunteer-media/index.ts'
      - name: Classify post-update findings
        shell: bash
        run: |
          npm audit --json > audit-after.json || true
          node <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('audit-after.json', 'utf8'))
          console.log('POST-UPDATE AUDIT', report.metadata?.vulnerabilities ?? {})
          for (const [name, vuln] of Object.entries(report.vulnerabilities ?? {})) {
            const via = (vuln.via ?? []).map((entry) => typeof entry === 'string' ? entry : `${entry.name}: ${entry.title} (${entry.severity})`).join(' | ')
            console.log(JSON.stringify({ name, severity: vuln.severity, direct: vuln.isDirect, range: vuln.range, via, effects: vuln.effects, fixAvailable: vuln.fixAvailable }))
          }
          NODE
      - name: Verify runtime audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Verify full audit has no high or critical findings
        run: npm audit --audit-level=high
      - run: npm test
      - run: npm run check:edge
      - run: npm run build
      - name: Commit lockfile refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --check
          git commit -m "security(deps): update vulnerable dependencies"
          git push origin HEAD:security/dependency-audit-2026-09-15
