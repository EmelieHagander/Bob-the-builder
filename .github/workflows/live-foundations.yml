name: Live foundation release check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/check-live-foundations.mjs
      - scripts/check-live-project-facts.mjs
      - scripts/check-live-solutions.mjs
      - scripts/check-live-artifacts.mjs
      - scripts/check-live-artifact-geometry.mjs
      - scripts/check-live-material-planning.mjs
      - scripts/check-live-sheet-layers.mjs
      - supabase/migrations/20260915183904_sheet_layer_material_quantities.sql
      - scripts/check-live-building-context.mjs
      - scripts/check-live-project-phases.mjs
      - scripts/check-live-volunteers.mjs
      - scripts/check-live-work-plan.mjs
      - supabase/migrations/20260913124500_persistent_building_context.sql
      - supabase/migrations/20260913135500_expose_physical_proposal_state.sql
      - supabase/migrations/20260913140500_physical_identity_delete_boundary.sql
      - supabase/migrations/20260913143000_building_context_fk_indexes.sql
      - supabase/migrations/20260913144500_building_delete_child_order.sql
      - supabase/migrations/20260913193000_artifact_deterministic_geometry.sql
      - supabase/migrations/20260913193100_artifact_geometry_command_grant.sql
      - supabase/migrations/20260913193200_artifact_geometry_invariants.sql
      - supabase/migrations/20260913194000_artifact_generation_space_revision_index.sql
      - supabase/migrations/20260913210000_material_planning.sql
      - supabase/migrations/20260913210100_material_planning_hardening.sql
      - supabase/migrations/20260913210200_material_planning_publish.sql
      - supabase/migrations/20260913210300_material_planning_reservation_serialization.sql
      - supabase/migrations/20260913210400_material_planning_fk_index.sql
      - supabase/migrations/20260914084207_deterministic_material_quantities.sql
      - supabase/migrations/20260913213712_household_project_sharing.sql
      - supabase/migrations/20260913214355_household_account_sharing.sql
      - supabase/migrations/20260914052752_volunteer_project_links.sql
      - supabase/migrations/20260914173410_sharing_rollout_hardening.sql
      - supabase/migrations/20260914164000_project_area_phases_and_scoped_targets.sql
      - supabase/migrations/20260914184600_project_targets_current_revision_fk_index.sql
      - supabase/migrations/20260915073000_executable_work_readiness.sql
      - .github/workflows/live-foundations.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify project foundations, sharing, phases, readiness and physical context with disposable data
        run: node scripts/check-live-foundations.mjs
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
