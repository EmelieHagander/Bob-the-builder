name: Live foundation release check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/check-live-foundations.mjs
      - scripts/check-live-project-facts.mjs
      - scripts/check-live-solutions.mjs
      - scripts/check-live-artifacts.mjs
      - .github/workflows/live-foundations.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify images, steps, facts, solutions and drawings with disposable data
        run: node scripts/check-live-foundations.mjs
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
