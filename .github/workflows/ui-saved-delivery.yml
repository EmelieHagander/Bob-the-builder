name: Saved delivery UI

# Owner-requested focused check; pushes and PR changes never start a workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  saved-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the app with isolated HTTP fixtures
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://pwa-proof.invalid
          VITE_SUPABASE_ANON_KEY: installation-test-only
      - name: Verify saved delivery at 320, 390 and 1280 pixels
        run: CHROME_PATH="$(command -v google-chrome)" FOUNDATION_FOCUS=saved-delivery npm run verify:foundations
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saved-delivery-screenshots
          path: test-results/
          if-no-files-found: ignore
