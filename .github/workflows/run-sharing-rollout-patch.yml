name: Apply sharing rollout live proof

on:
  push:
    branches:
      - fix/sharing-rollout-hardening
    paths:
      - .github/workflows/run-sharing-rollout-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sharing-rollout-hardening
      - name: Apply focused verifier patch
        run: python3 scripts/patch-sharing-rollout.py
      - name: Remove temporary helpers and commit
        run: |
          rm scripts/patch-sharing-rollout.py .github/workflows/run-sharing-rollout-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-live-foundations.mjs scripts/patch-sharing-rollout.py .github/workflows/run-sharing-rollout-patch.yml
          git commit -m "Compose hosted volunteer proof into foundation verifier"
          git push origin HEAD:fix/sharing-rollout-hardening
