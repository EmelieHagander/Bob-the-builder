name: Sync building context release docs

on:
  push:
    branches: [docs/record-building-context-release]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/record-building-context-release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch canonical release documentation
        run: python .github/scripts/sync-building-context-release-docs.py
      - name: Commit documentation only
        run: |
          git rm .github/workflows/sync-building-context-release-docs.yml
          git rm .github/scripts/sync-building-context-release-docs.py
          git config user.name "Bob release docs"
          git config user.email "actions@users.noreply.github.com"
          git add Docs/building-model.md Docs/index.md Docs/v1-plan.md Docs/function-inventory.md Docs/foundation-verification.md db/README.md
          git diff --check
          git diff --cached --stat
          git commit -m "Record live persistent building context release"
          git push origin HEAD:docs/record-building-context-release
