name: Sync building context release docs

on:
  push:
    branches: [docs/record-building-context-release]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/record-building-context-release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch canonical release documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing expected text: {label}')
              return text.replace(old, new, 1)

          # Domain owner: shipped/manual 2C status, broader future model still planned.
          p = 'Docs/building-model.md'
          t = read(p)
          old = """> **Status:** specified / planned; not implemented yet  
          > **Owns:** bob's persistent physical-place model across projects: sites, buildings, levels, spaces, building elements, spatial relationships, project scope, uncertainty and physical-state history  
          > **Release order:** `Docs/v1-plan.md` owns sequencing and release gates  
          > **Implementation truth:** current runtime/schema still use project-scoped `Area`, measurements, components, solutions and artifacts; this document must not be read as evidence that the building model already exists"""
          new = """> **Status:** manual Slice 2C implemented, deployed and live-verified on 2026-09-13; broader geometry/import/AI extensions remain planned  
          > **Owns:** bob's persistent physical-place model across projects: sites, buildings, levels, spaces, building elements, spatial relationships, project scope, uncertainty and physical-state history  
          > **Release order:** `Docs/v1-plan.md` owns sequencing and release gates  
          > **Implementation truth:** runtime/schema now persist Site → Building → optional Level → Space, BuildingElements, spatial relationships, Project/Area physical scope, accepted/proposed history and exact measurement snapshots. Later geometry/import/AI work must extend this shipped foundation rather than create a parallel physical model. Release evidence lives in `Docs/foundation-verification.md`."""
          t = replace_once(t, old, new, 'building-model status')
          write(p, t)

          # Navigation/status owner: remove stale planned-only wording.
          p = 'Docs/index.md'
          t = read(p)
          replacements = [
              ("Status is specified/planned until runtime work is verified.",
               "The manual 2C foundation is implemented, deployed and live-verified; broader geometry/import/AI fidelity remains planned."),
              ("- `Site` / `Building` / `Space` / `BuildingElement` — planned persistent physical context that may be reused across projects;\n- future Areas may map to physical targets, but the entities must not be silently conflated.",
               "- `Site` / `Building` / `Space` / `BuildingElement` — implemented persistent physical context that may be reused across projects;\n- Areas may map to physical targets through the shipped backend relation; the dedicated Area-side mapping editor remains a narrow UI follow-up, and the entities must not be silently conflated."),
              ("- `Docs/building-model.md` — planned persistent physical context that project/Area flows may later target.",
               "- `Docs/building-model.md` — deployed persistent physical context that project/Area flows may target, with broader geometry/import/AI fidelity still planned."),
              ("- `Docs/building-model.md` — product/domain owner for the planned persistent physical model. Exact schema/RLS does not exist merely because the product model is specified.",
               "- `Docs/building-model.md` — product/domain owner for the deployed manual 2C persistent physical model; `db/README.md` maps its current schema/RLS/commands, while broader future fidelity remains specified here."),
              ("- `Docs/foundation-verification.md` — media/steps, measurements/components and solution/target foundation evidence, deployed migrations, live Auth/PostgREST/Storage checks and limitations.",
               "- `Docs/foundation-verification.md` — media/steps, measurements/components, solution/target, plans/drawings and persistent building-context release evidence, deployed migrations, live Auth/PostgREST/Storage checks and limitations."),
          ]
          for old, new in replacements:
              t = replace_once(t, old, new, 'index drift')
          write(p, t)

          # Release plan owner: close 2C release evidence and point current work at active 4B1 without claiming it built.
          p = 'Docs/v1-plan.md'
          t = read(p)
          start = '## Current execution position — 2026-09-13\n'
          end = '\n---\n\n# 1. V1 thesis'
          a = t.find(start)
          b = t.find(end, a)
          if a < 0 or b < 0:
              raise SystemExit('could not locate V1 execution marker')
          current = """## Current execution position — 2026-09-13

The numbered slices describe the product dependency chain, but implementation has intentionally followed a **foundations-first execution lane**. Later manual foundations may therefore be live while earlier AI gates remain deliberately deferred.

**Deployed / live-verified foundations:**

- Slice 0 — trust foundation;
- Slice 1A — real project media;
- Slice 1B — manual illustrated task steps;
- Slice 2A — measurements/provenance/history;
- Slice 2B — existing components;
- Slice 2C — persistent Site/Building/Level/Space/BuildingElement context, spatial relationships, Project/Area physical-scope relations, accepted/proposed physical-state history and the manual **Building & spaces** UI;
- Slice 3A — alternatives + selected target;
- Slice 4A — manual plans/drawings with exact target and measurement lineage.

Slice 2C is now runtime truth, not merely committed design: PR #42 delivered the domain/schema/authority foundation, PR #43 the app-facing UI, and PR #45 the hosted cleanup-order correction. The dedicated browser proof passes at 320px, 390px and 1280px; the hosted Auth/PostgREST live check passes and self-cleans its physical fixture; the current `main` Pages deployment is green. `Docs/foundation-verification.md` owns exact migration/run evidence.

**Still open by deliberate deferral:**

- Slice 1C — Bob vision over authorised project images;
- full Slice 2 AI consumption of measurements/evidence and Bob-assisted whole-plan ingestion;
- Slice 3B generated visual proposals/mockups;
- deterministic generated geometry, BOM/calculations, stock/shopping propagation and richer executable work planning after 4A;
- Slice 5 generated/project-specific guidance and structured progress/as-built completion.

**Current next implementation milestone:** **Slice 4B1 deterministic artifact geometry for the deliberately narrow supported fixture.** PR #47 is the active implementation branch for the first timber stud-wall-with-opening fixture. Treat that PR as implementation in progress, not as built/deployed truth until its own schema, browser and live gates pass. Generated geometry must consume explicit `Building` / `Space` context and pinned measurements rather than treating project `Area` as the house model.

Area → physical-target mapping is backend-built and live-verified. A dedicated Area-side mapping editor remains a narrow follow-up; it is not a reason to reopen the sparse Building/Space foundation.

**Execution order from here:**

1. complete and release-gate the narrow deterministic artifact-geometry fixture (4B1), preserving physical-target and measurement provenance;
2. add transparent quantity/BOM derivation, existing-stock deduction and Shopping propagation, then richer task/dependency/tool/readiness relations;
3. add the deferred AI consumers on top of the persisted foundations rather than making AI output the only place those concepts exist;
4. complete Slice 5 guidance and progress/as-built loops against the same persisted project + physical context.

This section is the current execution marker. Detailed built/partial/gap truth still belongs to `Docs/function-inventory.md`; release scope and gates remain in this plan.
"""
          t = t[:a] + current + t[b:]
          t = t.replace(
              "Production/live verification of 2C is still required as release evidence.",
              "Production/live verification of 2C is complete; exact evidence is recorded in `Docs/foundation-verification.md`."
          )
          write(p, t)

          # Capability audit owner: record 2C delta and remaining UI/AI/geometry boundaries.
          p = 'Docs/function-inventory.md'
          t = read(p)
          t = replace_once(
              t,
              "historical\n> baseline before Slice 0 and milestones 1A/1B, 2A/2B, 3A and 4A**.",
              "historical\n> baseline before Slice 0 and milestones 1A/1B, 2A/2B, 2C, 3A and 4A**.",
              'inventory baseline note'
          )
          anchor = '## Solution and target foundation release delta — 2026-09-10\n'
          if anchor not in t:
              raise SystemExit('missing solution release delta anchor')
          block = """## Persistent building context release delta — 2026-09-13

**Status:** manual Slice 2C is implemented, merged, migrated, deployed and live-verified through
[PR 42](https://github.com/EmelieHagander/Bob-the-builder/pull/42),
[PR 43](https://github.com/EmelieHagander/Bob-the-builder/pull/43) and the hosted cleanup follow-up
[PR 45](https://github.com/EmelieHagander/Bob-the-builder/pull/45).
[Persistent building model](building-model.md) owns behavior; [foundation verification](foundation-verification.md)
owns exact migration, browser, live-service and cleanup evidence.

| Foundation | Current status |
|---|---|
| Persistent physical identity | **BUILT.** Site → Building → optional Level → Space persists independently of Project lifetime. A sparse one-room model is valid and may grow later without requiring a complete house model. |
| Physical authority + project context | **BUILT.** Site/Building membership is distinct from project membership. Explicit project scope grants bounded physical reads/proposals; direct Building authority controls accepted truth, proposal acceptance and guarded archive/delete. Cross-building/project leakage and raw membership/history mutation are denied. |
| Spaces, elements and topology | **BUILT.** Stable Spaces, BuildingElements and a narrow relationship vocabulary persist with project-filtered read views. The room-first and separate-building fixtures are backend-tested and hosted-live-verified. |
| Accepted truth vs proposals | **BUILT.** Current/as-is accepted state remains separate from the newest proposal. Explicit acceptance appends the next accepted revision; earlier accepted/proposed history remains readable. |
| Exact measurement lineage | **BUILT.** A Space revision can pin exact existing Measurement revisions into immutable snapshots. Later fact edits do not rewrite the older physical revision. |
| Manual Building & spaces UI | **BUILT.** Dashboard routes to a focused manual Site/Building/Level/Space/Element/relationship surface. Project linking, reload/read-back, building/project switching and explicit denied/unavailable states are browser-verified at 320/390/1280px. Demo mode does not invent saved physical truth. |
| Area → physical target editing | **PARTIAL.** The backend relation and guarded commands are built, tested and live-verified; a dedicated Area-side mapping editor remains a narrow UI follow-up. |
| Whole-plan ingestion, deterministic geometry and AI reasoning | **GAP / later slices.** The shipped model is the foundation those consumers must extend. It does not itself claim CAD/BIM, photo-to-plan import, generated geometry, engineering approval or AI-confirmed fact promotion. |

"""
          t = t.replace(anchor, block + anchor, 1)
          t = replace_once(
              t,
              '## Historical audit — before Slice 0 and milestones 1A/1B, 2A/2B, 3A and 4A',
              '## Historical audit — before Slice 0 and milestones 1A/1B, 2A/2B, 2C, 3A and 4A',
              'inventory historical heading'
          )
          write(p, t)

          # Release evidence owner: add 2C proof above prior 4A section.
          p = 'Docs/foundation-verification.md'
          t = read(p)
          anchor = '## Delivered manual plans and drawings (4A)\n'
          if anchor not in t:
              raise SystemExit('missing foundation 4A anchor')
          block = """## Delivered persistent building context (2C)

**Status:** manual 2C implemented, merged, migrated, deployed and live-verified on
2026-09-13. Backend/domain [PR 42](https://github.com/EmelieHagander/Bob-the-builder/pull/42)
merged as `d5dce52e531c271a54d0dbb28a55765d271c1e9b`; app/UI
[PR 43](https://github.com/EmelieHagander/Bob-the-builder/pull/43) merged as
`126a322f9ac59bc110525e2bb7ecd0575d24c3fa`. Hosted cleanup-order follow-up
[PR 45](https://github.com/EmelieHagander/Bob-the-builder/pull/45) merged as
`2562d15b4ffa99b53d15682c24010b87b81f2dbf`. The
[building-model contract](building-model.md) owns Site/Building/Level/Space,
BuildingElement/topology, physical authority, Project/Area scope, accepted/proposed
history and exact measurement-snapshot semantics.

### Automated and browser evidence

- Backend [CI 34762221631](https://github.com/EmelieHagander/Bob-the-builder/actions/runs/34762221631)
  passes on the final #42 head. The repository has 42 passing database/data-boundary
  tests, including all four building-model fixtures plus stale/raw/forged authority,
  Area mapping/lifecycle and physical deletion-boundary checks. TypeScript/Vite,
  edge, PWA/install and existing foundation/browser checks also pass.
- UI [CI 34769797360](https://github.com/EmelieHagander/Bob-the-builder/actions/runs/34769797360)
  passes on #43 head `74a270d92f8827ebe5b69ac696601ef2f4ae42a7`. The dedicated Building-context
  browser proof passes at 320, 390 and 1280px: create Building; start with one Space;
  project-link; reload/read-back; add a second Space + relationship; switch Buildings
  without stale detail; switch Project; and render explicit denied state instead of
  misrepresenting unread physical context as an empty building.

### Deployment and hosted migration history

Five additive source migrations make up the released 2C database change. Hosted
history records the same changes under deployment timestamps; do not replay the
source timestamps or edit already-applied migrations:

| Source migration | Hosted registry |
|---|---|
| `20260913124500_persistent_building_context.sql` | `20260913141333_bob_persistent_building_context` |
| `20260913135500_expose_physical_proposal_state.sql` | `20260913141342_bob_expose_physical_proposal_state` |
| `20260913140500_physical_identity_delete_boundary.sql` | `20260913141357_bob_physical_identity_delete_boundary` |
| `20260913143000_building_context_fk_indexes.sql` | `20260913142013_bob_building_context_fk_indexes` |
| `20260913144500_building_delete_child_order.sql` | `20260913143018_bob_building_delete_child_order` |

The core migration is additive: existing Areas, measurements, components, solutions
and artifacts are not rewritten. Normal clients read RLS-protected tables through
security-invoker views and mutate physical truth only through guarded `bob.physical_*`
commands. Private authority helpers stay in `bob_private` with explicit execute ACLs.

Post-DDL advisor review introduced the dedicated FK-index follow-up above. The final
security advisor reports no new 2C-specific security finding. The performance advisor
still reports INFO-level covering-index opportunities on several accepted-revision /
composite physical foreign keys plus expected fresh-unused-index notices; these are
performance follow-ups, not release-authority failures. See the
[unindexed-FK remediation guide](https://supabase.com/docs/guides/database/database-linter?lint=0001_unindexed_foreign_keys).

### Live Auth/PostgREST proof and cleanup

[Live foundation check 34762945539](https://github.com/EmelieHagander/Bob-the-builder/actions/runs/34762945539)
passes on `main` after the cleanup-order fix. Through the ordinary authenticated Bob
client it proves persistent Site/Building/Level/Spaces, project and Area scope,
topology, an exact Measurement snapshot, accepted current vs proposal state, explicit
acceptance/history, RLS and raw-write denial. No AI is invoked.

The same run then unlinks project context and removes the disposable physical fixture
through the normal guarded authority commands. The log explicitly confirms
`Live building context fixture removed through guarded physical-authority commands.`
No test Building/Site is left behind by the verifier.

The current merged UI is also deployed: [Pages 34773319558](https://github.com/EmelieHagander/Bob-the-builder/actions/runs/34773319558)
passes for current `main` commit `b1c11f194d286775c6125eac46ad894b429bfdc8`.
Area-side physical-target editing remains a later narrow UI follow-up; backend Area
mapping is already covered by database and hosted live checks. Whole-plan import,
generated geometry and AI/vision consumption remain later gates and are not implied
by this 2C release.

"""
          t = t.replace(anchor, block + anchor, 1)
          write(p, t)

          # Data/migration owner: map the shipped physical model and exact migration registry.
          p = 'db/README.md'
          t = read(p)
          row_anchor = '| `ProjectArtifact`, `ArtifactVersion` | `bob.artifacts`, append-only `bob.artifact_revisions`, exact `bob.artifact_measurements`, invoker `bob.current_artifacts` / `bob.artifact_measurement_details` |\n'
          rows = """| `PhysicalSite`, `PhysicalBuilding`, `PhysicalLevel`, `PhysicalSpace` | `bob.sites`, `bob.buildings`, `bob.building_levels`, `bob.building_spaces` + append-only revision tables and security-invoker current/project views |
          | `PhysicalElement`, `PhysicalRelationship` | `bob.building_elements`, `bob.spatial_relationships` + append-only revision tables; accepted current state remains separate from latest proposals |
          | `ProjectPhysicalScope`, `AreaPhysicalTarget` | `bob.project_physical_scope`, `bob.area_physical_targets` |
          | `SpaceMeasurementSnapshot` | `bob.space_measurements`, invoker `bob.space_measurement_details` with exact historical Measurement versions |
          """
          if rows.strip() not in t:
              t = replace_once(t, row_anchor, row_anchor + rows, 'db mapping rows')

          anchor = '## Wiring the app to it\n'
          if anchor not in t:
              raise SystemExit('missing db wiring anchor')
          section = """## Persistent building context foundation (2C)

[`Docs/building-model.md`](../Docs/building-model.md) owns the persistent physical
place contract. Manual 2C is deployed/live-verified: Site → Building → optional
Level → Space persists independently of Project lifetime; BuildingElements and a
narrow Space relationship vocabulary add topology; Project/Area scope links work
without redefining `Area` as a physical room; accepted current truth remains separate
from Project proposals; and Space revisions can snapshot exact Measurement revisions.

Source migrations and hosted registry entries are:

| Source migration | Hosted registry |
|---|---|
| `supabase/migrations/20260913124500_persistent_building_context.sql` | `20260913141333_bob_persistent_building_context` |
| `supabase/migrations/20260913135500_expose_physical_proposal_state.sql` | `20260913141342_bob_expose_physical_proposal_state` |
| `supabase/migrations/20260913140500_physical_identity_delete_boundary.sql` | `20260913141357_bob_physical_identity_delete_boundary` |
| `supabase/migrations/20260913143000_building_context_fk_indexes.sql` | `20260913142013_bob_building_context_fk_indexes` |
| `supabase/migrations/20260913144500_building_delete_child_order.sql` | `20260913143018_bob_building_delete_child_order` |

Do not replay these source timestamps or edit applied migrations. Physical tables and
history are RLS-protected. `bob_private` owns physical membership/authority helpers;
normal app writes go through the guarded `bob.physical_site_command`,
`bob.physical_building_command`, `bob.physical_node_command` and
`bob.physical_scope_command` wrappers. `src/data/buildingContext.ts` is the app domain
adapter behind the single `database.ts` UI seam. Guarded physical deletion requires
direct authority, a current archived identity and no active Project/Area scope; the
follow-up delete migration removes child identities in explicit safe order while
preserving strong foreign keys.

[Foundation verification](../Docs/foundation-verification.md) owns the exact CI,
320/390/1280 browser, hosted Auth/PostgREST, Pages and self-cleanup evidence. This
foundation does not claim whole-plan import, general CAD/BIM, generated geometry or
AI promotion of uncertain evidence into fact.

"""
          if '## Persistent building context foundation (2C)' not in t:
              t = t.replace(anchor, section + anchor, 1)
          write(p, t)
          PY

          git rm .github/workflows/sync-building-context-release-docs.yml
          git config user.name "Bob release docs"
          git config user.email "actions@users.noreply.github.com"
          git add Docs/building-model.md Docs/index.md Docs/v1-plan.md Docs/function-inventory.md Docs/foundation-verification.md db/README.md
          git diff --check
          git diff --cached --stat
          git commit -m "Record live persistent building context release"
          git push origin HEAD:docs/record-building-context-release
