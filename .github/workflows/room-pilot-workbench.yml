name: Publish verified room pilot source
on:
  push:
    branches: [feat/linked-room-drawing-pilot]
    paths: [.github/workflows/room-pilot-workbench.yml]
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'EmelieHagander/Bob-the-builder' && github.ref == 'refs/heads/feat/linked-room-drawing-pilot'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 16
      - name: Verify reviewed patch and unchanged source baseline
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet 09151e4c2a7a77ef3d5dd36cd50037fed9d3c12a -- Docs src scripts supabase tests
          python3 - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          parts = sorted(Path('.github/room-pilot-patch').glob('*.b64'))
          assert [p.name for p in parts] == [f'{n:02d}.b64' for n in range(6)]
          patch = lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'b21c55d6059557d0daf626dee0c7ad769578641adb909013674330796a3d25a4'
          Path(os.environ['RUNNER_TEMP'], 'room-pilot.patch').write_bytes(patch)
          PY
          git apply --check --index "$RUNNER_TEMP/room-pilot.patch"
          git apply --index --whitespace=error-all "$RUNNER_TEMP/room-pilot.patch"
          git rm .github/workflows/room-pilot-workbench.yml .github/room-pilot-patch/*.b64
          git diff --cached --check
          test "$(git write-tree)" = '8d30e8a8ed4e5dbb1c60a85f760cc4218e2e2b0a'
      - name: Commit exact tested tree to the feature branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add chat-driven linked room plans with atomic source-pinned revisions'
          git push origin HEAD:refs/heads/feat/linked-room-drawing-pilot
