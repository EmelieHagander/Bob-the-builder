name: Compose material planning live proof
on:
  push:
    branches:
      - feat/manual-material-planning
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/manual-material-planning
      - name: Patch foundation composition
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/check-live-foundations.mjs')
          text = p.read_text()
          old = "import { verifyArtifacts, verifyArtifactImageCleanup } from './check-live-artifacts.mjs'\nimport { verifyBuildingContext } from './check-live-building-context.mjs'"
          new = "import { verifyArtifacts, verifyArtifactImageCleanup } from './check-live-artifacts.mjs'\nimport { verifyMaterialPlanning } from './check-live-material-planning.mjs'\nimport { verifyBuildingContext } from './check-live-building-context.mjs'"
          if old not in text:
              raise SystemExit('live import marker missing')
          text = text.replace(old, new, 1)
          old = "  artifacts = await verifyArtifacts(client, project.id, areaId, imageId, facts, solutions)\n  await verifyBuildingContext(client, anonymous, project.id, areaId, facts)"
          new = "  artifacts = await verifyArtifacts(client, project.id, areaId, imageId, facts, solutions)\n  await verifyMaterialPlanning(client, anonymous, project.id, areaId, taskId, facts, artifacts)\n  await verifyBuildingContext(client, anonymous, project.id, areaId, facts)"
          if old not in text:
              raise SystemExit('live call marker missing')
          text = text.replace(old, new, 1)
          p.write_text(text)
          Path('.github/workflows/patch-live-material-composition.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Compose material planning into hosted foundation proof'
          git push origin HEAD:feat/manual-material-planning
