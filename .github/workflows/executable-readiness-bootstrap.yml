name: Bootstrap executable work readiness

on:
  push:
    branches:
      - feat/executable-work-readiness

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message == 'Run executable readiness integration'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/executable-work-readiness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply isolated integration patch
        run: python scripts/apply-work-readiness-integration.py
      - run: npm ci
      - run: npm test
      - run: npm run check:edge
      - run: npm run build
      - run: node --check scripts/check-project-phases-browser.mjs
      - name: Build live-mode browser fixture
        env:
          VITE_SUPABASE_URL: https://pwa-proof.invalid
          VITE_SUPABASE_ANON_KEY: installation-test-only
        run: npm run build
      - name: Verify phase + readiness field flow
        run: CHROME_PATH="$(command -v google-chrome)" node scripts/check-project-phases-browser.mjs
      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/executable-readiness-bootstrap.yml scripts/apply-work-readiness-integration.py
          git add src/data/databaseCore.ts src/pages/TaskDetail.tsx src/pages/AreaWorkstream.tsx src/pages/Today.tsx scripts/check-project-phases-browser.mjs supabase/migrations/20260915073000_executable_work_readiness.sql
          git commit -m "Integrate executable work readiness"
          git push origin HEAD:feat/executable-work-readiness
