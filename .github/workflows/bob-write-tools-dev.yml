name: Bob write tools development
on:
  push:
    branches: [feat/bob-write-tools-chat-controls]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6ed764759003bf3ca9fb621514e7a4fe2ee29c14
          persist-credentials: false
      - run: git archive --format=tar.gz --output=/tmp/bob-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: bob-source-with-reset
          path: /tmp/bob-source.tar.gz
          retention-days: 1
