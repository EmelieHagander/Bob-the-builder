name: Create 4B2b migration

on:
  push:
    branches:
      - feat/deterministic-material-quantities
    paths:
      - .github/workflows/create-4b2b-migration.yml

permissions:
  contents: write

jobs:
  create-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/deterministic-material-quantities
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create migration through Supabase CLI
        run: npx supabase migration new deterministic_material_quantities
      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git commit -m "Add 4B2b migration scaffold"
          git push origin HEAD:feat/deterministic-material-quantities
