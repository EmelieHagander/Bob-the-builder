name: P2c migration filename bootstrap
on:
  pull_request:
    paths: ['.github/workflows/p2c-migration-bootstrap.yml']
jobs:
  filename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx --no-install supabase migration new --help
      - run: npx --no-install supabase migration new drawing_request_restoration
