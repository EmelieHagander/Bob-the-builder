name: Create readiness index migration

on:
  push:
    branches:
      - fix/readiness-live-verification
    paths:
      - .github/workflows/create-readiness-index-migration.yml

permissions:
  contents: write

jobs:
  create-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/readiness-live-verification
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Create migration through Supabase CLI
        run: npx supabase migration new executable_work_readiness_fk_index
      - name: Commit migration scaffold and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/create-readiness-index-migration.yml
          git add supabase/migrations
          git commit -m "Add readiness FK index migration scaffold"
          git push origin HEAD:fix/readiness-live-verification
