name: Close 4B2b release docs

on:
  push:
    branches:
      - docs/close-4b2b-release-work
    paths:
      - .github/workflows/close-4b2b-release-docs.yml

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/close-4b2b-release-work
      - name: Apply canonical release sync
        run: python3 scripts/patch-4b2b-release-docs.py
      - name: Remove temporary patch helpers
        run: rm scripts/patch-4b2b-release-docs.py .github/workflows/close-4b2b-release-docs.yml
      - name: Commit release docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Docs db scripts .github/workflows
          git diff --cached --quiet && { echo "No documentation changes produced"; exit 1; }
          git commit -m "Record live 4B2b release truth"
          git push origin HEAD:docs/close-4b2b-release-work
