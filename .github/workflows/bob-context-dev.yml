name: Bob context development
on:
  push:
    branches: [feat/bob-context-builder-chat]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Snapshot source and locked test dependencies
        run: |
          git archive --format=tar.gz --output=/tmp/bob-source.tar.gz HEAD
          tar -czf /tmp/bob-deps.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: bob-context-workspace
          path: |
            /tmp/bob-source.tar.gz
            /tmp/bob-deps.tar.gz
          retention-days: 1
