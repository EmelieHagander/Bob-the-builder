name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:vocabulary
      - run: npm test
      - run: node --check scripts/check-live-bob.mjs
      - run: node --check scripts/check-live-plan-assistant.mjs
      - run: node --check scripts/check-live-foundations.mjs
      - run: node --check scripts/check-live-project-facts.mjs
      - run: node --check scripts/check-live-solutions.mjs
      - run: node --check scripts/check-live-artifacts.mjs
      - run: node --check scripts/check-live-material-planning.mjs
      - run: node --check scripts/check-live-sheet-layers.mjs
      - run: node --check scripts/check-live-building-context.mjs
      - run: node --check scripts/check-live-project-phases.mjs
      - run: node --check scripts/check-live-volunteers.mjs
      - run: node --check scripts/check-live-work-plan.mjs
      - run: npm run check:edge
      # Type-check + production build; no env needed — the build is
      # backend-agnostic (Supabase config is injected at deploy time).
      - run: npm run build
      - run: npm run verify:pwa
      - name: Verify settings, phone guide and offline retry
        run: CHROME_PATH="$(command -v google-chrome)" npm run verify:install
      - name: Build with a dummy live configuration
        id: live_build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://pwa-proof.invalid
          VITE_SUPABASE_ANON_KEY: installation-test-only
      - name: Verify unified Project, Area, Step and Task work
        run: CHROME_PATH="$(command -v google-chrome)" node scripts/check-project-work-browser.mjs
      - name: Verify Bob conversation reset and recovery
        run: CHROME_PATH="$(command -v google-chrome)" node scripts/check-bob-reset-browser.mjs
      - name: Verify household sharing and friend invitation UI
        if: ${{ !cancelled() && steps.live_build.outcome == 'success' }}
        run: CHROME_PATH="$(command -v google-chrome)" node scripts/check-sharing-browser.mjs
      - name: Verify registration-free volunteer participation
        if: ${{ !cancelled() && steps.live_build.outcome == 'success' }}
        run: CHROME_PATH="$(command -v google-chrome)" node scripts/check-volunteer-browser.mjs
      - name: Verify public installation before login
        run: CHROME_PATH="$(command -v google-chrome)" npm run verify:install -- --public-only
      - name: Verify Ask bob project isolation and mobile source disclosure
        run: CHROME_PATH="$(command -v google-chrome)" npm run verify:project
      - name: Verify images, steps, measurements, parts, solutions and drawings
        run: CHROME_PATH="$(command -v google-chrome)" npm run verify:foundations
      - name: Verify persistent building context UI
        run: CHROME_PATH="$(command -v google-chrome)" npm run verify:building
      - name: Verify Project and Area phase UI
        run: CHROME_PATH="$(command -v google-chrome)" node scripts/check-project-phases-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installation-screenshots
          path: test-results/
          if-no-files-found: ignore
