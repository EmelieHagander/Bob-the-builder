name: Apply 4B2b implementation patch

on:
  push:
    branches:
      - feat/deterministic-material-quantities
    paths:
      - .github/workflows/apply-4b2b-patch.yml

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/deterministic-material-quantities
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python scripts/patch-4b2b.py
      - run: python scripts/patch-4b2b-fix.py
      - run: npm test
      - run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations src scripts tests
          git commit -m "Implement deterministic material quantities"
          git push origin HEAD:feat/deterministic-material-quantities
