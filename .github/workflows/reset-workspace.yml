name: Apply reviewed conversation reset source
on:
  push:
    branches: [feat/bob-conversation-reset-20260917]
    paths: [.github/workflows/reset-workspace.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bob-conversation-reset-20260917
      - name: Apply verified application sources only
        run: |
          python3 - <<'PY'
          import base64, hashlib, pathlib, subprocess, zlib
          text = pathlib.Path('.bob-reset.patch.b64').read_text().strip()
          text = text.replace('Fk6yCNth', 'Fk6yNth').replace('rnrWFmWF0', 'rnrWF0')
          patch = zlib.decompress(base64.b64decode(text))
          assert hashlib.sha256(patch).hexdigest() == '02556e71865d570d369b792a1cfb8d6e51dc6133b238e6e93a1fab5d90448e90'
          # Workflow changes are made separately through the authorized connector.
          subprocess.run(['git', 'apply', '--check', '--exclude=.github/workflows/ci.yml', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--exclude=.github/workflows/ci.yml', '-'], input=patch, check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          PY
      - name: Commit application sources on the feature branch
        run: |
          rm .bob-reset.patch.b64
          git add Docs/ask-bob-conversations.md Docs/index.md scripts/check-bob-reset-browser.mjs src/components/AskBob.tsx src/data/bobConversation.ts src/data/database.ts supabase/migrations/20260917201626_ask_bob_conversation_reset.sql tests/bob-reset.test.ts .bob-reset.patch.b64
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add guarded New conversation control clearing transcript and model cursor'
          git push origin HEAD:feat/bob-conversation-reset-20260917
