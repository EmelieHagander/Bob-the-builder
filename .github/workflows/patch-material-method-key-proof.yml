name: Patch material method-key proof

on:
  push:
    branches: [fix/material-planning-method-key-proof]
    paths:
      - .github/workflows/patch-material-method-key-proof.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/material-planning-method-key-proof
      - name: Align fixtures with deployed server truth
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          replacements = {
              Path('scripts/check-live-material-planning.mjs'): ("assert.equal(requirement.method_key, 'manual_base')", "assert.equal(requirement.method_key, 'manual')"),
              Path('scripts/material-planning-browser.mjs'): ("source_kind: 'manual', method_key: 'manual_base', method_version: '4B2a-v1'", "source_kind: 'manual', method_key: 'manual', method_version: '4B2a-v1'"),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one old marker, found {text.count(old)}')
              path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/patch-material-method-key-proof.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/check-live-material-planning.mjs scripts/material-planning-browser.mjs .github/workflows/patch-material-method-key-proof.yml
          git commit -m "Align material method-key release proof"
          git push origin HEAD:fix/material-planning-method-key-proof
