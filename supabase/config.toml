# Supabase CLI config. Legacy bootstrap lives in db/; newer CLI migrations live
# in supabase/migrations/. Follow the coordinated rollout in db/README.md.

project_id = "bob-the-builder"

# Bob's direct OpenAI endpoint also validates the Auth user and project access.
[functions.ask-bob]
verify_jwt = true

# Retired endpoint: returns 410 without calling a provider or reading project data.
[functions.ask-launchpad]
verify_jwt = true

# Named volunteers have no Auth JWT. A separate Bob capability authorizes every
# task image request, including a second check before bytes leave the server.
[functions.volunteer-media]
verify_jwt = false
